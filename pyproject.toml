[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function-calling with constrained decoding for small LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "pydantic>=2.7.0",
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "llm-sdk",
    "torch>=2.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
exclude = ["tests/", "llm_sdk/"]

[[tool.mypy.overrides]]
module = ["llm_sdk.*"]
follow_imports = "skip"

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
